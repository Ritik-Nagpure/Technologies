<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Homepage</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center text-white font-sans">

  <div class="bg-white text-gray-800 rounded-xl shadow-xl p-8 max-w-md w-full animate-fade-in">
    <!-- Profile Section -->
    <div class="flex items-center space-x-4 mb-6">
      <img src="https://i.pravatar.cc/100?img=3" alt="User Avatar" class="w-16 h-16 rounded-full border-2 border-purple-500" />
      <div>
        <h2 class="text-xl font-bold">Welcome, Jane Doe</h2>
        <p class="text-sm text-gray-500">jane.doe@example.com</p>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="space-y-4">
      <a href="/profile" class="block w-full bg-blue-500 text-white text-center py-2 rounded-lg hover:bg-blue-600 transition">View Profile</a>
      <a href="/settings" class="block w-full bg-purple-500 text-white text-center py-2 rounded-lg hover:bg-purple-600 transition">Settings</a>
      <a href="/logout" class="block w-full bg-red-500 text-white text-center py-2 rounded-lg hover:bg-red-600 transition">Logout</a>
    </div>
  </div>

  <!-- Custom Animation -->
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.8s ease-out forwards;
    }
  </style>
</body>
</html>
