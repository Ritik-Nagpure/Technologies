<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express App Homepage</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#0ea5e9',
            accent: '#f59e0b',
          },
          animation: {
            fadeIn: 'fadeIn 1s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0, transform: 'translateY(20px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>
</head>
<body class="bg-gradient-to-br from-brand to-accent min-h-screen flex items-center justify-center text-white font-sans">

  <main class="text-center p-6 max-w-xl animate-fadeIn">
    <!-- Icon -->
    <div class="mb-6">
      <svg class="mx-auto w-16 h-16 text-white animate-bounce" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    </div>

    <!-- Heading -->
    <h1 class="text-4xl font-bold mb-4 drop-shadow-lg">Welcome to Your Express App 🎉</h1>

    <!-- Subheading -->
    <p class="text-lg mb-6 opacity-90">Fast, flexible, and ready to serve. Let’s build something awesome together.</p>

    <!-- CTA Buttons -->
    <div class="space-x-4">
      <a href="/json" class="bg-white text-brand font-semibold px-6 py-3 rounded-full shadow-lg hover:bg-accent hover:text-white transition duration-300">
        View JSON
      </a>
      <a href="/text" class="bg-white text-accent font-semibold px-6 py-3 rounded-full shadow-lg hover:bg-brand hover:text-white transition duration-300">
        View Text
      </a>
    </div>
  </main>
</body>
</html>
