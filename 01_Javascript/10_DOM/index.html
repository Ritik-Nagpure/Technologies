<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="refresh" content="5"> -->
    <script src="01_Selectors.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>DOM Demo</title>
</head>

<body class="flex flex-col justify-between items-center align-middle bg-amber-100 m-2 p-4">
    <div class="flex flex-col w-full m-0 p-0 align-middle justify-center items-center">
        <div class="font-bold text-5xl text-amber-700">
            01 Selectors
        </div>
        <div class="h-0.5 my-4 bg-amber-950 w-5/6 rounded-full "></div>
        <div class="flex flex-row justify-center items-center m-4 p-4 w-full text-xl text-white">
            <div class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950 "
                onclick="queryselall()">
                <p class="qsel">
                    Query Selector All Demo
                </p>
            </div>
            <div class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950"
                onclick="querysel()">
                <p class="qsel">
                    Query Selector Demo
                </p>
            </div>
            <div
                class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950 ">
                <p id="idsel">
                    <button onclick="idsel()"> ID Selector Demo</button>
                </p>
            </div>

            <div class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950 "
                onclick="classsel()">
                <p class="classsel">
                    Class Selector Demo
                </p>
            </div>

            <div
                class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950">
                <h4>
                    <button onclick="tagsel()"> Tag Selector Demo </button>
                </h4>
            </div>
        </div>
    </div>

    <div class="flex flex-col w-full mt-10 p-0 align-middle justify-center items-center">
        <div class="font-bold text-5xl text-amber-700">
            02 Selectors
        </div>
        <div class="h-0.5 my-4 bg-amber-950 w-5/6 rounded-full "></div>
        <div class="flex flex-row justify-center items-center m-4 p-4 w-full text-xl text-white">
            <div
                class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950">
                <p id="idsel">
                    <button onclick="idsel()"> ID Selector Demo</button>
                </p>
            </div>

            <div class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950"
                onclick="classsel()">
                <p class="classsel">
                    Class Selector Demo
                </p>
            </div>

            <div
                class="flex items-center bg-amber-900 h-40 w-1/6 mx-4 rounded-xl shadow-3xl z-10 p-4  hover:font-semibold duration-300 ease-in-out hover:bg-amber-950">
                <h4>
                    <button onclick="tagsel()"> Tag Selector Demo </button>
                </h4>
            </div>

        </div>
    </div>

</html>
