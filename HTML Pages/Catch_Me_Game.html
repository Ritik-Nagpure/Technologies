<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magic/1.1.0/magic.min.css"
        integrity="sha512-5KJYgPF7pe0cdJAg/9X6UdHE5cN9fqjjIi8ASyIqlcsKZdHVouNRcweLGEdtrIJJxMn+GqwJBjAurCjWOvEdJQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="index.css" />
    <title>Catch me</title>

    <script>
        function dis() {
            alert("I Love you Too Baby !!!");
        }

        function loaded() {
            let bt = document.getElementById("ghost");
            bt.style.setProperty("--l", "50%");
            bt.style.setProperty("--t", "50%");
        }

        function homove() {
            let bt = document.getElementById("ghost");

            let left = (Math.random() * 90).toPrecision(2) + "%";
            let top = (Math.random() * 90).toPrecision(2) + "%";

            console.log(left, top);
            bt.style.setProperty("--l", left);
            bt.style.setProperty("--t", top);
        }
    </script>

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background-color: black;
            color: rgb(255, 255, 255);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-size: xx-large;
            font-family: cursive;
        }

        .but {
            height: 60px;
            width: fit-content;
            padding: 4px;

            font-size: xx-large;
            font-family: cursive;

            background-color: transparent;
            border: solid 0px;
            border-radius: 20px;

            box-shadow: 1px 1px 5px white, -1px -1px 5px white;
            background-color: rgb(192, 190, 190);         
        }

        .que_option {           
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        #ghost{
            position:absolute;
            animation-fill-mode: forwards;
            left: var(--l);
            top: var(--t);
        }

        .animove {
            animation-name: bmove;
            animation-duration: 5s;
        }


        @keyframes bmove {
            to {
                left: var(--l);
                top: var(--t);
            }
        }

        .question {
            color: greenyellow;
        }
    </style>
</head>

<body onload="loaded()">
    <div class="question">
        Will you go out with me ?
    </div>
    <div style="margin: 20px;" class="que_option">
        <button onclick="dis()" class="but">
                Yes
        </button>
        <div></div>
        <button onmouseover="homove()" class="but" id="ghost">
                No !!
        </button>
    </div>
    <div>
        <img src="https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTA0L2pvYjY4Ni0yODUtcC5wbmc.png" height="300rem" width="270rem" style="background: transparent;"/>
    </div>
</body>

</html>
