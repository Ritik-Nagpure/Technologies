        WEB PAGES

    <style>
        body {
            background: linear-gradient(-45deg, #be5839, #af2a5d, #1c8bb3, #2cb394);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        #mainDiv {
            height: 90%;
            padding-left: 3%;
            padding-right: 3%;
            padding-top: 5%;
            padding-bottom: 5%;

            display: flex;
            flex-direction: column;
            justify-content:space-evenly;

        }


        header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            padding-top: 1%;
            color: rgb(239, 218, 218);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 40px;
            font-weight: bolder;



        }

        .createTaskButton {
            border-radius: 10px;
            font-size: 30px;
            color: rgb(71, 71, 71);
            background: rgb(246, 234, 170);
            border: 5px;
            height: fit-content;
            width: 100%;
            padding: 20px;
        }

    </style>

    <script>     
        function openkanban() {
            window.location.href = "Kanban.html"
        }
        function opendateproposal() {
            window.location.href ="Catch_Me_Game.html"
        }
        function opentodo() {
            window.location.href = "Todo.html"
        }
        function openfancytodo() {
            window.location.href = "FancyTodo.html"
        }
    </script>
</head>

<body onload="runOnLoad()">
    <header>
       Select APP TO VISIT
    </header>
    <div id="mainDiv">
        <button onclick=openkanban() class="createTaskButton">
            Kanban Board 
        </button>        
        
        <button onclick=opendateproposal() class="createTaskButton">            
            Date Proposal
        </button>
        
        
        <button onclick=opentodo() class="createTaskButton">             
            Todo            
        </button>
        
       
        <button onclick=openfancytodo() class="createTaskButton">            
            Fancy Todo           
        </button>
    </div>
